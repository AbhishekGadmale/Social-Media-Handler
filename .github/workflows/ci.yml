name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'

jobs:
  quality:
    name: Code Quality (Lint & Typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @agency-os/database exec prisma generate

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agency_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @agency-os/database exec prisma generate

      - name: Apply Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/agency_os_test?schema=public
        run: pnpm --filter @agency-os/database exec prisma migrate deploy

      - name: Run Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/agency_os_test?schema=public
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/agency_os_test?schema=public
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super-secret-test-jwt-key
          COOKIE_SECRET: super-secret-test-cookie-key
          YOUTUBE_CLIENT_ID: dummy-client-id
          YOUTUBE_CLIENT_SECRET: dummy-client-secret
          TURBO_ENV_MODE: loose
        run: pnpm turbo run test --env-mode=loose

  e2e:
    name: API E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agency_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: cgr.dev/chainguard/minio:latest@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @agency-os/database exec prisma generate

      - name: Apply Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/agency_os_test?schema=public
        run: pnpm --filter @agency-os/database exec prisma migrate deploy

      - name: Create MinIO test bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://agency-os-media || true

      - name: Build packages
        run: pnpm turbo run build

      - name: Run API E2E Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/agency_os_test?schema=public
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/agency_os_test?schema=public
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super-secret-test-jwt-key
          COOKIE_SECRET: super-secret-test-cookie-key
          YOUTUBE_CLIENT_ID: dummy-client-id
          YOUTUBE_CLIENT_SECRET: dummy-client-secret
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
          OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
          OBJECT_STORAGE_REGION: us-east-1
          OBJECT_STORAGE_BUCKET: agency-os-media
          OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
          OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
          OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
        run: pnpm --filter @agency-os/api test:e2e

  build:
    name: Application Builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @agency-os/database exec prisma generate

      - name: Build applications
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        run: pnpm turbo run build

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          docker compose build api worker web migration
          docker build -f docker/nginx/Dockerfile -t agency-os-ingress:staging .

      - name: Smoke test Compose stack
        env:
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DATABASE_URL: postgresql://postgres:password@postgres:5432/agency_os?schema=public
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/agency_os_test?schema=public
          REDIS_URL: redis://redis:6379
          JWT_SECRET: super-secret-test-jwt-key
          COOKIE_SECRET: super-secret-test-cookie-key
          YOUTUBE_CLIENT_ID: dummy-client-id
          YOUTUBE_CLIENT_SECRET: dummy-client-secret
          API_PUBLIC_URL: http://localhost:3001
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agency_os
        run: |
          docker compose up -d postgres redis

          # Wait for PostgreSQL
          echo "Waiting for postgres..."
          for i in {1..30}; do
            docker compose exec -T postgres pg_isready -U postgres -d agency_os && break
            sleep 2
          done

          # Wait for Redis
          echo "Waiting for redis..."
          for i in {1..30}; do
            docker compose exec -T redis redis-cli ping && break
            sleep 2
          done

          docker compose up -d migration

          # Wait for migration
          echo "Waiting for migration..."
          docker compose logs -f migration &
          MIGRATION_PID=$!

          for i in {1..60}; do
            STATUS=$(docker compose ps migration --format "{{.State}}")
            if [ "$STATUS" = "exited" ]; then
              break
            fi
            sleep 2
          done
          kill $MIGRATION_PID || true

          docker compose up -d api worker web

          # Wait for API health check (asserts HTTP 2xx and verified database readiness)
          echo "Waiting for API health..."
          API_HEALTHY=false
          for i in {1..30}; do
            RESPONSE=$(curl -fsS http://localhost:3001/api/health/ready 2>/dev/null) && {
              echo "$RESPONSE" | grep -q '"database":{"status":"up"}' && {
                API_HEALTHY=true
                echo "API is ready: $RESPONSE"
                break
              }
            }
            sleep 2
          done
          if [ "$API_HEALTHY" != "true" ]; then
            echo "API health check failed or returned non-2xx status!"
            docker compose logs api
            exit 1
          fi

          # Exercise direct Prisma database operation probe inside the API container
          echo "Running Prisma database query probe..."
          docker compose exec -w /app/apps/api -T api node -e 'const { PrismaClient } = require("@agency-os/database"); const prisma = new PrismaClient(); prisma.$queryRawUnsafe("SELECT 1 as test").then(() => { console.log("Prisma database query probe succeeded"); process.exit(0); }).catch((err) => { console.error("Prisma query probe failed:", err); process.exit(1); });'

          # Verify Web responds with HTTP 2xx
          echo "Waiting for Web..."
          WEB_HEALTHY=false
          for i in {1..30}; do
            curl -fsS http://localhost:3000 >/dev/null 2>&1 && {
              WEB_HEALTHY=true
              echo "Web is ready"
              break
            }
            sleep 2
          done
          if [ "$WEB_HEALTHY" != "true" ]; then
            echo "Web readiness check failed or returned non-2xx status!"
            docker compose logs web
            exit 1
          fi

          docker compose logs api
          docker compose logs worker
          docker compose logs web
          docker compose ps
          docker compose down -v

      - name: Validate Staging Compose required secrets fail-fast
        run: |
          echo "Testing missing required secrets fail-fast on staging compose..."
          if docker compose -f docker-compose.staging.yml config >/dev/null 2>&1; then
            echo "Expected staging compose config to fail on missing secrets, but it succeeded!"
            exit 1
          else
            echo "Staging compose config failed fast as expected on missing secrets."
          fi

      - name: Smoke test Staging Compose stack with Ingress
        env:
          STAGING_PORT: "8080"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-staging-postgres-password
          POSTGRES_DB: agency_os
          SESSION_SECRET: test-staging-session-secret-key-1234
          JWT_SECRET: super-secret-test-jwt-key
          COOKIE_SECRET: super-secret-test-cookie-key
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          FRONTEND_URL: http://localhost:8080
          API_PUBLIC_URL: http://localhost:8080
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
          OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
          OBJECT_STORAGE_BUCKET: agency-os-media
        run: |
          # Start staging database and redis
          docker compose -f docker-compose.staging.yml up -d postgres redis

          # Wait for PostgreSQL
          echo "Waiting for postgres..."
          for i in {1..30}; do
            docker compose -f docker-compose.staging.yml exec -T postgres pg_isready -U postgres -d agency_os && break
            sleep 2
          done

          # Wait for Redis
          echo "Waiting for redis..."
          for i in {1..30}; do
            docker compose -f docker-compose.staging.yml exec -T redis redis-cli ping && break
            sleep 2
          done

          # Run database migrations
          docker compose -f docker-compose.staging.yml up -d migration

          echo "Waiting for migration..."
          docker compose -f docker-compose.staging.yml logs -f migration &
          MIGRATION_PID=$!

          for i in {1..60}; do
            STATUS=$(docker compose -f docker-compose.staging.yml ps migration --format "{{.State}}")
            if [ "$STATUS" = "exited" ]; then
              break
            fi
            sleep 2
          done
          kill $MIGRATION_PID || true

          # Start api, worker, web, and ingress
          docker compose -f docker-compose.staging.yml up -d api worker web ingress

          # Verify Ingress /healthz endpoint
          echo "Waiting for Ingress health..."
          INGRESS_HEALTHY=false
          for i in {1..30}; do
            curl -fsS http://localhost:8080/healthz 2>/dev/null && {
              INGRESS_HEALTHY=true
              echo "Ingress /healthz is ready"
              break
            }
            sleep 2
          done
          if [ "$INGRESS_HEALTHY" != "true" ]; then
            echo "Ingress health check failed!"
            docker compose -f docker-compose.staging.yml logs ingress
            exit 1
          fi

          # Verify API readiness through ingress (/api/health/ready)
          echo "Waiting for API readiness through ingress..."
          STAGING_API_HEALTHY=false
          for i in {1..30}; do
            RESPONSE=$(curl -fsS http://localhost:8080/api/health/ready 2>/dev/null) && {
              echo "$RESPONSE" | grep -q '"database":{"status":"up"}' && {
                STAGING_API_HEALTHY=true
                echo "API through Ingress is ready: $RESPONSE"
                break
              }
            }
            sleep 2
          done
          if [ "$STAGING_API_HEALTHY" != "true" ]; then
            echo "API health check through ingress failed or returned non-2xx status!"
            docker compose -f docker-compose.staging.yml logs api
            docker compose -f docker-compose.staging.yml logs ingress
            exit 1
          fi

          # Verify Web through ingress (/)
          echo "Waiting for Web through ingress..."
          STAGING_WEB_HEALTHY=false
          for i in {1..30}; do
            curl -fsS http://localhost:8080 >/dev/null 2>&1 && {
              STAGING_WEB_HEALTHY=true
              echo "Web through Ingress is ready"
              break
            }
            sleep 2
          done
          if [ "$STAGING_WEB_HEALTHY" != "true" ]; then
            echo "Web readiness through ingress failed!"
            docker compose -f docker-compose.staging.yml logs web
            docker compose -f docker-compose.staging.yml logs ingress
            exit 1
          fi

          # Verify internal ports are NOT published to host
          echo "Verifying internal ports are not exposed on host..."
          if curl -fsS http://localhost:3001 2>/dev/null; then
            echo "Security violation: API port 3001 is directly reachable on host!"
            exit 1
          fi
          if curl -fsS http://localhost:3000 2>/dev/null; then
            echo "Security violation: Web port 3000 is directly reachable on host!"
            exit 1
          fi
          echo "Host isolation verified: direct ports 3000 and 3001 are closed."

          # Clean up staging compose stack
          docker compose -f docker-compose.staging.yml down -v
