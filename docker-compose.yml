services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agency_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: packages/database/Dockerfile.migration
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/agency_os?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/agency_os?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: development-secret-1234
      ENCRYPTION_KEY: 00000000000000000000000000000000
      FRONTEND_URL: http://localhost:3000
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-mock-client-id}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-mock-client-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/health/ready']
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/agency_os?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: development-secret-1234
      ENCRYPTION_KEY: 00000000000000000000000000000000
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-mock-client-id}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-mock-client-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
