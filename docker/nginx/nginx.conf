# Agency OS — Unified NGINX Ingress Configuration for Staging/Production
# Runs as unprivileged non-root user (UID 101: nginx) on port 8080

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable temp paths for unprivileged execution
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Stripped access log format: logs method, normalized URI path, and protocol without
    # query parameters to prevent OAuth authorization code/state/token credential leakage.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 512M accommodates MEDIA_MAX_UPLOAD_BYTES=524288000 (500MB) with headroom for multipart/form-data boundary and header overhead.
    client_max_body_size 512m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # WebSocket connection upgrade mapping:
    # When $http_upgrade is present (WebSocket), send 'upgrade'.
    # When empty (normal HTTP requests), send '' so Connection header is cleared,
    # preserving HTTP/1.1 keepalive connection pooling to upstreams.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    # Upstream TLS protocol determination:
    # If TLS terminates directly on this ingress, $scheme is "https".
    # If ingress is operating behind a trusted edge proxy (Option A: Cloudflare, AWS ALB),
    # preserve the edge proxy's X-Forwarded-Proto header if it passed "https".
    # Note: In an edge-terminated topology, origin firewall rules MUST restrict
    # inbound access on this port to trusted edge proxy IP ranges to prevent header spoofing.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    upstream api_upstream {
        server api:3001;
        keepalive 32;
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # Ingress Healthcheck
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # NestJS API Routing
        # Preserves URI and query string; passes through /api/* to api:3001
        location /api {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            # Upstream keepalive
            proxy_set_header Connection "";

            # Proxy timeouts (60s connect, 120s send/read)
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffer settings for streaming / large responses
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Next.js Web Frontend Routing
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            # WebSocket upgrade headers (preserves keepalive when upgrade is empty)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Proxy timeouts (60s connect, 120s send/read)
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
